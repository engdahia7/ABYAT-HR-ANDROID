name: Build ABYAT HR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        id: buildapk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show real build error
        if: steps.buildapk.outcome == 'failure'
        shell: bash
        run: |
          echo "========== REAL BUILD ERROR =========="
          grep -nE "(^e:|error:|Unresolved reference|Type mismatch|Cannot access|Expecting|Compilation error)" build.log || tail -n 200 build.log
          exit 1

      - name: Upload APK
        if: steps.buildapk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ABYAT-HR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
