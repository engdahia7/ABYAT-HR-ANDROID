<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>أبيات للموظفين</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f5f0;color:#202a34;display:grid;place-items:center;min-height:100vh;padding:24px}
    .card{max-width:440px;width:100%;background:#fff;border-radius:24px;padding:32px;box-shadow:0 16px 50px rgba(0,0,0,.08);text-align:center}
    h1{font-size:26px;margin:0 0 12px}p{line-height:1.8;color:#66707a}button{border:0;background:#202a34;color:#fff;padding:14px 22px;border-radius:14px;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>أبيات للموظفين</h1>
    <p>تعذر الاتصال بالخادم. تحقق من اتصال الإنترنت ثم حاول مرة أخرى.</p>
    <button onclick="location.href='https://abyategy.gt.tc/hr/'">إعادة المحاولة</button>
  </div>
</body>
</html>
